<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SndlA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- UI / UX -->
    <link rel="stylesheet" href="/style.css">

</head>
<body>
     <div id="map"></div>
     <div id = "topBar">
        <span class = "pill green">2/50</span>
        <span class = "pill black">5 plants saved</span>
     </div>
     <div id = "card">
        <img id = "cardPhoto" alt="">
        <div class = "topCard">
            <div>
                <div id = "cardDistance">--m</div> 
                <div id = "cardName">Looking for the trail...</div>
                <div id = "cardNote"></div>
            </div>
        </div>
        <div class = "cardPills">
            <span id = "sunsetTime" class = "sunsetTime">~40 min</span>
            <span id = "trailTime" class = "trailTime">~70 mins</span>
        </div>
        <button id = "prevBtn" class = "navBtn" onclick = "prevStep()">&lt;</button>
        <button id = "nextBtn" class = "navBtn" onclick = "nextStep()">&gt;</button>
     </div>

     <div id = "restPopup">
        <img id = "restPhoto" alt = "">
        <div class = "restSmall">While you are resting...</div>
        <div class = "restTitle">Look around the ground</div>
        <div class = "restSub">The shelter area is where most of the trash gathers.</div>

        <div id = "restActions">
            <button id = "cameraBtn" onclick = "openCamera()">&#128465; I found trash</button>
            <button id = "trashBtn" onclick = "onTrashClean()">&#128465;</button>
            <div class = "restSmall restLabel" onclick = "onTrashClean()">It's Clean</div>
        </div>

        <div id = "photoActions">
            <button onclick = "openCamera()">Retake</button>
            <button class = "primary" onclick = "onPhotoDone()">Done</button>
        </div>
     </div>
     <input id = "photoInput" type = "file" accept = "image/*" capture = "environment" style = "display:none">

     <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
     <script src = "https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"> </script>
     <script src="/app.js"></script>
</body>
</html>
